# Publish the documentation site.
#
# The site's chrome lives on gh_pages; its content lives here. This renders
# docs/ and the Go reference into that branch, commits, then builds and
# deploys.
#
# It deploys itself rather than handing over to pages.yml on gh_pages: a push
# made with GITHUB_TOKEN does not start another workflow, and neither does a
# repository_dispatch sent with it, so there is no way to trigger that build
# from here without a personal access token.
name: Publish docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'scripts/**'
      - '{{cookiecutter.project_slug}}/**'
      - 'cookiecutter.json'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  build:
    name: Render and build
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the sync works out when each document last
      # changed and which release carried it.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout the site
        uses: actions/checkout@v4
        with:
          ref: gh_pages
          path: .site

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      # The scaffold is Jinja, so gomarkdoc cannot read it. Render the template
      # and generate the reference from the result — the actual output of the
      # pipeline a generated project runs.
      - name: Render the template
        run: |
          pip install --upgrade cookiecutter
          cookiecutter --no-input -o .out . \
            project_name="Probe CLI" github_owner=acme \
            author_name="Template CI" author_email=ci@example.com \
            init_git_repo=no
          make -C .out/probe-cli docs

      # The site's own chrome is edited on gh_pages, so its tip can move while
      # this runs. Everything written here is derived, so on a rejected push
      # the answer is to regenerate on top of whatever landed and try again
      # rather than to merge.
      - name: Render and commit to gh_pages
        id: commit
        run: |
          set -euo pipefail

          git -C .site config user.name  'github-actions[bot]'
          git -C .site config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          echo "changed=false" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            git -C .site fetch --quiet origin gh_pages
            git -C .site reset --quiet --hard origin/gh_pages

            python3 scripts/sync-docs.py --site .site
            python3 scripts/sync-reference.py --site .site --project .out/probe-cli

            git -C .site add -A docs _data
            if git -C .site diff --cached --quiet; then
              echo "documentation is unchanged; nothing to commit"
              exit 0
            fi

            git -C .site commit --quiet -m "docs: sync from ${GITHUB_SHA::12}"
            if git -C .site push --quiet origin HEAD:gh_pages; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::notice::gh_pages moved while this ran; regenerating on top of it (attempt $attempt)"
          done

          echo "::error::could not publish to gh_pages after three attempts"
          exit 1

      # Runs after the commit: it rewrites versions.md in place, and that file
      # must keep its marker on the branch.
      - name: Render the changelog into the versions page
        run: |
          mkdir -p .site/.main
          cp CHANGELOG.md .site/.main/CHANGELOG.md
          python3 .site/scripts/inject-changelog.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./.site
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "Synced \`docs/\` and the reference to \`gh_pages\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No documentation changes; rebuilt anyway." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Shared with pages.yml on gh_pages, so the two can never deploy at once.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
