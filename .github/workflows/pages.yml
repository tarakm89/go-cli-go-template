# Build and deploy this branch as the documentation site.
#
# The repository's Pages source is "GitHub Actions", so a push to gh_pages is
# published by this workflow rather than by Jekyll's built-in branch build.
#
# The version list is not stored here: it is pulled from CHANGELOG.md on main
# at build time, so a release only ever has to be written down once.
name: Deploy documentation site

on:
  push:
    branches: ["gh_pages"]
  # Sent by the publish-docs workflow on main after it syncs docs/ here.
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated, changelog-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and never cancel one in flight.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the site
        uses: actions/checkout@v4

      - name: Checkout the changelog from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .main
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Render the changelog into the versions page
        run: python3 scripts/inject-changelog.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
